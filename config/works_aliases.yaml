# Cited-work dictionary for citation resolution (ADR-018, DECISIONS §12c).
# works: canonical works with the short titles books cite them by (matched after normalization).
# ambiguous: short titles that may mean several works; such citations stay unresolved and go to review.
# not_works: quoted words that are not cited books (e.g. "الأصل" = the manuscript, EC-052).
# this_book: titles by which the processed book refers to itself.

