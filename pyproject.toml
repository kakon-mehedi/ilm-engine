[project]
name = "ilm-engine"
version = "0.1.0"
description = "Post-OCR knowledge enrichment for digitized Islamic books"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2",
    "typer",
    "pyyaml",
]

[project.optional-dependencies]
llm = ["anthropic", "litellm"]
nlp = ["camel-tools"]
semantic = ["sentence-transformers"]

[project.scripts]
ilm-engine = "ilm_engine.cli:app"

[dependency-groups]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ilm_engine"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
